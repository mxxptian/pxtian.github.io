# Welcome to Jekyll!
#
# Site-wide configuration for Peixin Tian's academic homepage.

# =========================
# Basic Site Settings
# =========================

locale                   : "en-US"
site_theme               : "default"

title                    : "Peixin Tian"
title_separator          : "-"
name                     : &name "Peixin Tian"

description              : &description "Peixin Tian | Statistical Genetics, High-Dimensional Statistics, and Biomedical Data Science"

# GitHub Pages project site
url                      : "https://mxxptian.github.io"
baseurl                  : "/pxtian.github.io"
repository               : "mxxptian/pxtian.github.io"


# =========================
# Site Author
# =========================

author:
  avatar           : "profile.png"
  name             : "Peixin Tian"
  pronouns         :
  bio              : "Teaching Fellow | Statistical Genetics | Biomedical Data Science"
  location         : "Hong Kong SAR"
  employer         : "The Hong Kong Polytechnic University"
  uri              :
  email            : "pxtian.tian@polyu.edu.hk"

  # Academic profiles
  googlescholar    : "https://scholar.google.com/citations?user=HhubY1MAAAAJ&hl=en"
  academia         :
  arxiv            :
  inspire-hep      :
  impactstory      :
  orcid            :
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     :
  scopus           :
  zotero           :

  # Repositories and software development
  github           : "mxxptian"
  bitbucket        :
  codepen          :
  dribbble         :
  kaggle           :
  stackoverflow    :

  # Social media
  linkedin         :
  twitter          :
  bluesky          :
  facebook         :
  instagram        :
  mastodon         :
  medium           :
  youtube          :
  zhihu            :
  weibo            :
  artstation       :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  lastfm           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  vine             :
  wikipedia        :
  xing             :


# =========================
# Publication Categories
# =========================

publication_category:
  books:
    title: "Books"

  manuscripts:
    title: "Journal Articles"

  conferences:
    title: "Conference Papers"


# =========================
# Site Settings
# =========================

teaser                   :
breadcrumbs              : false
words_per_minute         : 160

# Keep future-dated publications visible if necessary
future                   : true

read_more                : "disabled"

# No talk map for now
talkmap_link             : false


# =========================
# Comments
# =========================

comments:
  provider               :

  disqus:
    shortname            :

  discourse:
    server               :

  facebook:
    appid                :
    num_posts            :
    colorscheme          :


staticman:
  allowedFields          : ["name", "email", "url", "message"]
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ["name", "email", "message"]

  transforms:
    email                : "md5"

  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"


# =========================
# RSS Feed
# =========================

atom_feed:
  hide                   : true
  path                   :


# =========================
# SEO
# =========================

google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# =========================
# Social Sharing Metadata
# =========================

twitter:
  username               : &twitter

facebook:
  username               :
  app_id                 :
  publisher              :

og_image                 :
og_description           : "Peixin Tian is a Teaching Fellow in the Department of Applied Mathematics at The Hong Kong Polytechnic University, with research interests in statistical genetics, high-dimensional statistics, causal inference, and biomedical data science."

social:
  type                   : Person
  name                   : "Peixin Tian"
  links:
    - "https://scholar.google.com/citations?user=HhubY1MAAAAJ&hl=en"
    - "https://github.com/mxxptian"


# =========================
# Analytics
# =========================

analytics:
  provider               : "false"

  google:
    tracking_id          :


# =========================
# Reading Files
# =========================

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding                  : "utf-8"
markdown_ext              : "markdown,mkdown,mkdn,mkd,md"


# =========================
# Markdown / Conversion
# =========================

markdown                  : kramdown
highlighter               : rouge
lsi                       : false
excerpt_separator         : "\n\n"
incremental               : false

kramdown:
  input                   : GFM
  hard_wrap               : false
  auto_ids                : true
  footnote_nr             : 1
  entity_output           : as_char
  toc_levels              : 1..6
  smart_quotes            : lsquo,rsquo,ldquo,rdquo
  enable_coderay          : false


# =========================
# Collections
# =========================

collections:

  teaching:
    output: true
    permalink: /:collection/:path/

  publications:
    output: true
    permalink: /:collection/:path/

  portfolio:
    output: true
    permalink: /:collection/:path/

  talks:
    output: true
    permalink: /:collection/:path/


# =========================
# Default Layout Settings
# =========================

defaults:

  # Posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: false
      related: true

  # Pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  # Teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # Publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # Portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  # Talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false


# =========================
# Sass / SCSS
# =========================

sass:
  sass_dir: _sass
  style: compressed


# =========================
# Output
# =========================

permalink: /:categories/:title/

# Hong Kong timezone
timezone: Asia/Hong_Kong


# =========================
# Plugins
# =========================

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# GitHub Pages safe mode
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# =========================
# Archives
# =========================

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/


# =========================
# HTML Compression
# =========================

compress_html:
  clippings: all

  ignore:
    envs: development
